# Zola configuration for the phaselock.tech landing page.
#
# Templates read these through the `config` object. Every key under [extra]
# that a template names must exist here: Tera aborts the build on a missing
# variable rather than rendering blank, so that correspondence is enforced by
# `zola build` and does not need policing by hand.
#
# INVARIANTS
#   - base_url equals the sole line of static/CNAME, prefixed https://, no
#     trailing slash. They are one decision recorded in two files: CNAME is
#     what makes Pages answer for the host, base_url is what makes the emitted
#     HTML point at it. Change one without the other and the site either 404s
#     or serves pages whose every link references the wrong origin.
#   - No --base-url override appears in .github/workflows/deploy.yml, so CI
#     and a local build cannot drift.
#   - Every key here is accepted BOTH by the zola shell.nix pins (0.20.0) and
#     by a current zola. Verify with `zola build` and
#     `nix-shell --run 'zola build'`, then diff the two public/ trees; they
#     must be byte-identical. The site is routinely built by whatever zola is
#     on a developer's PATH, not only by the pinned one, so a key that exists
#     in just one of them is a live breakage.
#
# base_url must match where the site is actually served or every internal
# link, the stylesheet <link> and the canonical URL break. It is paired with
# static/CNAME, which is what tells GitHub Pages to serve this host at all —
# change one and you must change the other.
base_url = "https://phaselock.tech"

title = "phaselock"
description = "An exact-cycle computing stack. Performance as a compile time property."

# The site is one page of hand-written HTML and CSS: nothing to index, no
# feed to generate, no Sass to compile. Every one of these defaults to the
# value set here, but they are stated explicitly so a future section cannot
# silently switch one on.
compile_sass = false
build_search_index = false
generate_feeds = false

# Trailing slashes off: /about, not /about/. Only matters if a second page is
# ever added, but the choice belongs in config, not in whichever template
# happens to be written first.
hard_link_static = false

[markdown]
# Smart punctuation: the pitch prose uses quotes and dashes.
smart_punctuation = true

# Syntax highlighting is deliberately NOT configured here. Zola renamed
# `highlight_code`/`highlight_theme` to a `highlighting` table after 0.20, so
# any spelling of it builds on one side of that boundary and hard-fails on the
# other — and this site has no fenced code blocks for it to act on (the proof
# transcript is hand-built HTML in templates/index.html). Leaving it out is
# what lets both the pinned 0.20 and a newer zola build this tree. If a code
# block is ever added, set it using the spelling of whichever version the pin
# and the deploy workflow agree on, and check the other still builds.

[extra]
# The hero's call to action, and the only outbound link on the site. It is a
# mailto rather than a link to the source because the code is not public: an
# anonymous request to the code repo 404s, and the org page serves nothing but
# a profile README. A source link would promise something that is not on the
# other side of it. When the repos open, add the URL back here and restore the
# header nav and footer link in templates/base.html.
contact_email = "lily@phaselock.tech"
